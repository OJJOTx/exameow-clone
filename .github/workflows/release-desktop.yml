name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.5.2)'
        required: false
        default: ''

env:
  APP_NAME: Exameow
  PNPM_VERSION: '10'
  NODE_VERSION: '22'

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-desktop
          path: frontend/dist

  build-desktop:
    needs: build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows_amd64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine release tag
        id: tag_info
        shell: pwsh
        run: |
          $tag = "${{ inputs.version }}"
          if (-not $tag) {
            if ("${{ github.ref }}" -like "refs/tags/v*") {
              $tag = "${{ github.ref_name }}"
            } else {
              $pkg = Get-Content package.json | ConvertFrom-Json
              $tag = "v$($pkg.version)"
            }
          }
          Write-Host "Resolved release tag: $tag"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_TAG=$tag"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_VERSION=$($tag.TrimStart('v'))"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist-desktop
          path: frontend/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup updater signing key
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Host "No TAURI_SIGNING_PRIVATE_KEY secret found. Generating temporary signing key..."
            pnpm tauri signer generate -p "exameow" -w "$env:RUNNER_TEMP\tauri_key" --ci
            $key = Get-Content "$env:RUNNER_TEMP\tauri_key" -Raw
            Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY=$key"
            Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=exameow"
          }
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build Tauri
        run: pnpm tauri build --target ${{ matrix.target }} ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Retry Build Tauri (transient download failures)
        if: failure() && matrix.platform == 'windows-latest'
        run: pnpm tauri build --target ${{ matrix.target }} ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect Windows artifacts
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Get-ChildItem target/${{ matrix.target }}/release/bundle/msi/*.msi | ForEach-Object {
            Copy-Item $_.FullName "dist/Exameow-${env:RELEASE_TAG}-${{ matrix.artifact }}.msi"
          }
          Get-ChildItem target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe | ForEach-Object {
            Copy-Item $_.FullName "dist/Exameow-${env:RELEASE_TAG}-${{ matrix.artifact }}-setup.exe"
          }
          Get-ChildItem target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe.sig | ForEach-Object {
            Copy-Item $_.FullName "dist/Exameow-${env:RELEASE_TAG}-${{ matrix.artifact }}-setup.exe.sig"
          }
          if (Test-Path "target/${{ matrix.target }}/release/exameow.exe") {
            Copy-Item "target/${{ matrix.target }}/release/exameow.exe" "dist/Exameow.exe"
            Compress-Archive -Path "dist/Exameow.exe" -DestinationPath "dist/Exameow-${env:RELEASE_TAG}-${{ matrix.artifact }}-portable.zip"
            Remove-Item "dist/Exameow.exe"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          path: dist/*

  release:
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine release tag
        id: tag_info
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            TAG="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: desktop-*

      - name: Generate latest.json for updater
        run: |
          node -e "
          const fs = require('fs');
          const tag = process.env.TAG;
          const base = 'https://github.com/' + process.env.REPO + '/releases/download/' + tag + '/';
          const files = fs.readdirSync('artifacts');
          const find = (suffix) => files.find((f) => f.endsWith(suffix));
          const platforms = {};
          const add = (key, fileSuffix, sigSuffix) => {
            const f = find(fileSuffix);
            const s = find(sigSuffix);
            if (f && s) {
              platforms[key] = {
                signature: fs.readFileSync('artifacts/' + s, 'utf8').trim(),
                url: base + f,
              };
            }
          };
          add('windows-x86_64', '-setup.exe', '-setup.exe.sig');
          add('darwin-aarch64', '.app.tar.gz', '.app.tar.gz.sig');
          add('linux-x86_64', 'linux_amd64.AppImage', 'linux_amd64.AppImage.sig');
          fs.writeFileSync('artifacts/latest.json', JSON.stringify({
            version: tag.replace(/^v/, ''),
            notes: 'See release notes',
            pub_date: new Date().toISOString(),
            platforms,
          }, null, 2));
          "
        env:
          TAG: ${{ steps.tag_info.outputs.tag }}
          REPO: ${{ github.repository }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: ${{ env.APP_NAME }} ${{ steps.tag_info.outputs.tag }}
          prerelease: false
          draft: true
          body: |
            ## 🔗 Quick Links
            - [Documentation](https://github.com/${{ github.repository }}#readme)

            ## 📦 Downloads

            👉 [Windows-msi](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag_info.outputs.tag }}/Exameow-${{ steps.tag_info.outputs.tag }}-windows_amd64.msi)

            👉 [Windows-portable](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag_info.outputs.tag }}/Exameow-${{ steps.tag_info.outputs.tag }}-windows_amd64-portable.zip)

            👉 [Windows-setup](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag_info.outputs.tag }}/Exameow-${{ steps.tag_info.outputs.tag }}-windows_amd64-setup.exe)
          files: artifacts/*
          fail_on_unmatched_files: false
