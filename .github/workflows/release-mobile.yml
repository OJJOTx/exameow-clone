name: Release Mobile

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.5.2)'
        required: false
        default: ''

env:
  APP_NAME: Exameow
  PNPM_VERSION: '10'
  NODE_VERSION: '22'
  JAVA_VERSION: '17'
  ANDROID_NDK_VERSION: '27.0.12077973'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Determine release tag
        id: tag_info
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            TAG="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          echo "RELEASE_VERSION=${TAG#v}" >> $GITHUB_ENV

      - name: Check OTA minShell covers new native commands
        run: bash scripts/check-ota-minshell.sh "${RELEASE_VERSION}"

      - run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;${{ env.ANDROID_NDK_VERSION }}'

      - name: Init Android project
        run: |
          pnpm tauri android init
          pnpm tauri icon src-tauri/icons/icon.png
          sed -i 's/#fff/#EE9D62/' src-tauri/gen/android/app/src/main/res/values/ic_launcher_background.xml
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />|' src-tauri/gen/android/app/src/main/AndroidManifest.xml
          grep CAMERA src-tauri/gen/android/app/src/main/AndroidManifest.xml

      - name: Build Android APK
        run: pnpm tauri android build --apk --target aarch64
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}

      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Sign and align APK (debug keystore)
        run: |
          mkdir -p dist
          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          ALIGNED_APK="dist/Exameow-${RELEASE_TAG}-android_arm64.apk"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -f -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks ~/.android/debug.keystore \
            --ks-pass "pass:android" \
            --key-pass "pass:android" \
            --ks-key-alias androiddebugkey \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$ALIGNED_APK"
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Package OTA bundle
        run: |
          TAG="${RELEASE_TAG}"
          VERSION="${RELEASE_VERSION}"
          MIN_SHELL=$(python3 -c "import json;print(json.load(open('ota.json'))['minShell'])")
          tar -czf mobile-dist.tar.gz -C frontend/dist .
          SHA=$(sha256sum mobile-dist.tar.gz | cut -d' ' -f1)
          SIZE=$(stat -c%s mobile-dist.tar.gz)
          printf '{\n  "version": "%s",\n  "minShell": "%s",\n  "url": "https://github.com/%s/releases/download/%s/mobile-dist.tar.gz",\n  "sha256": "%s",\n  "size": %s\n}\n' \
            "$VERSION" "$MIN_SHELL" "${{ github.repository }}" "$TAG" "$SHA" "$SIZE" > mobile-ota.json
          cat mobile-ota.json
          mv mobile-dist.tar.gz mobile-ota.json dist/

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*

  release:
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine release tag
        id: tag_info
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            TAG="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: android-apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Exameow ${{ steps.tag_info.outputs.tag }}
          prerelease: false
          draft: true
          body: |
            ## 🔗 Quick Links
            - [Documentation](https://github.com/${{ github.repository }}#readme)

            ## 📦 Downloads

            👉 [Android-apk-Arm64](https://github.com/${{ github.repository }}/releases/download/${{ steps.tag_info.outputs.tag }}/Exameow-${{ steps.tag_info.outputs.tag }}-android_arm64.apk)
          files: artifacts/*
          fail_on_unmatched_files: false
